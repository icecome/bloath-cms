<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloath CMS</title>
    <script>
      // 首屏前同步主题：读持久化偏好（'dark'|'light'），未设置时跟随系统。
      // 必须在模块脚本执行前完成，避免暗色用户先看到一帧亮色背景（FOUC）
      (function () {
        var stored = localStorage.getItem('bloath_theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- data-cfasync="false" 让 Cloudflare Rocket Loader 跳过入口模块脚本（该站开着
         Rocket Loader，它会改写 type="module" 并异步重新注入，破坏模块执行上下文）。
         构建时这条属性会被 Vite 丢弃，由 vite.config.ts 的 rocketLoaderOptOut 插件
         在产物里重新打上，两处不要只改一处。 -->
    <script type="module" data-cfasync="false" src="/src/main.tsx"></script>
  </body>
</html>
