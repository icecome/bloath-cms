<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloath CMS - 新建文章</title>
    <style id="theme-vars">
/* ============================================
   Bloath CMS — Design Tokens
   黑色强调色 · 暖色极简底板
   ============================================ */

/* --- Light Mode --- */
:root {
  /* 底板：微暖米白 */
  --blth-background: 34 20% 97%;
  --blth-foreground: 24 6% 17%;

  /* 卡片：纯白保持 */
  --blth-card: 0 0% 100%;
  --blth-card-foreground: 24 6% 17%;

  /* 浮层 */
  --blth-popover: 0 0% 100%;
  --blth-popover-foreground: 24 6% 17%;

  /* 主色：近黑色强调色 */
  --blth-primary: 0 0% 12%;
  --blth-primary-foreground: 0 0% 100%;

  /* 弱化色 */
  --blth-muted: 36 14% 94%;
  --blth-muted-foreground: 30 6% 45%;

  /* 边框：保持极细 */
  --blth-border: 30 10% 90%;
  --blth-input: 30 10% 90%;
  --blth-ring: 0 0% 12%;

  /* 圆角 */
  --blth-radius-sm: 0.25rem;  /* 4px */
  --blth-radius-md: 0.375rem; /* 6px */
  --blth-radius-lg: 0.5rem;   /* 8px */

  /* 语义色 */
  --blth-success: 142 55% 48%;
  --blth-warning: 36 70% 52%;
  --blth-destructive: 0 72% 56%;
}

/* --- Dark Mode --- */
.dark {
  --blth-background: 30 8% 8%;
  --blth-foreground: 34 15% 92%;

  --blth-card: 30 6% 11%;
  --blth-card-foreground: 34 15% 92%;

  --blth-popover: 30 6% 11%;
  --blth-popover-foreground: 34 15% 92%;

  --blth-primary: 0 0% 85%;
  --blth-primary-foreground: 0 0% 10%;

  --blth-muted: 30 6% 16%;
  --blth-muted-foreground: 30 8% 55%;

  --blth-border: 30 6% 20%;
  --blth-input: 30 6% 20%;
  --blth-ring: 0 0% 85%;

  --blth-success: 142 50% 42%;
  --blth-warning: 36 65% 48%;
  --blth-destructive: 0 62% 52%;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--blth-background);
    --color-foreground: var(--blth-foreground);
    --color-card: var(--blth-card);
    --color-card-foreground: var(--blth-card-foreground);
    --color-popover: var(--blth-popover);
    --color-popover-foreground: var(--blth-popover-foreground);
    --color-primary: var(--blth-primary);
    --color-primary-foreground: var(--blth-primary-foreground);
    --color-muted: var(--blth-muted);
    --color-muted-foreground: var(--blth-muted-foreground);
    --color-destructive: var(--blth-destructive);
    --color-border: var(--blth-border);
    --color-input: var(--blth-input);
    --color-ring: var(--blth-ring);
    --radius-sm: var(--blth-radius-sm);
    --radius-md: var(--blth-radius-md);
    --radius-lg: var(--blth-radius-lg);
  }
  @layer base {
    body { background: var(--blth-background); color: var(--blth-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--blth-background); }
      .text-background { color: var(--blth-background); }
      .border-background { border-color: var(--blth-background); }
      .ring-background { --tw-ring-color: var(--blth-background); }
      .bg-foreground { background-color: var(--blth-foreground); }
      .text-foreground { color: var(--blth-foreground); }
      .border-foreground { border-color: var(--blth-foreground); }
      .ring-foreground { --tw-ring-color: var(--blth-foreground); }
      .bg-card { background-color: var(--blth-card); }
      .text-card { color: var(--blth-card); }
      .border-card { border-color: var(--blth-card); }
      .ring-card { --tw-ring-color: var(--blth-card); }
      .bg-card-foreground { background-color: var(--blth-card-foreground); }
      .text-card-foreground { color: var(--blth-card-foreground); }
      .border-card-foreground { border-color: var(--blth-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--blth-card-foreground); }
      .bg-popover { background-color: var(--blth-popover); }
      .text-popover { color: var(--blth-popover); }
      .border-popover { border-color: var(--blth-popover); }
      .ring-popover { --tw-ring-color: var(--blth-popover); }
      .bg-popover-foreground { background-color: var(--blth-popover-foreground); }
      .text-popover-foreground { color: var(--blth-popover-foreground); }
      .border-popover-foreground { border-color: var(--blth-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--blth-popover-foreground); }
      .bg-primary { background-color: var(--blth-primary); }
      .text-primary { color: var(--blth-primary); }
      .border-primary { border-color: var(--blth-primary); }
      .ring-primary { --tw-ring-color: var(--blth-primary); }
      .bg-primary-foreground { background-color: var(--blth-primary-foreground); }
      .text-primary-foreground { color: var(--blth-primary-foreground); }
      .border-primary-foreground { border-color: var(--blth-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--blth-primary-foreground); }
      .bg-muted { background-color: var(--blth-muted); }
      .text-muted { color: var(--blth-muted); }
      .border-muted { border-color: var(--blth-muted); }
      .ring-muted { --tw-ring-color: var(--blth-muted); }
      .bg-muted-foreground { background-color: var(--blth-muted-foreground); }
      .text-muted-foreground { color: var(--blth-muted-foreground); }
      .border-muted-foreground { border-color: var(--blth-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--blth-muted-foreground); }
      .bg-destructive { background-color: var(--blth-destructive); }
      .text-destructive { color: var(--blth-destructive); }
      .border-destructive { border-color: var(--blth-destructive); }
      .ring-destructive { --tw-ring-color: var(--blth-destructive); }
      .bg-border { background-color: var(--blth-border); }
      .text-border { color: var(--blth-border); }
      .border-border { border-color: var(--blth-border); }
      .ring-border { --tw-ring-color: var(--blth-border); }
      .bg-input { background-color: var(--blth-input); }
      .text-input { color: var(--blth-input); }
      .border-input { border-color: var(--blth-input); }
      .ring-input { --tw-ring-color: var(--blth-input); }
      .bg-ring { background-color: var(--blth-ring); }
      .text-ring { color: var(--blth-ring); }
      .border-ring { border-color: var(--blth-ring); }
      .ring-ring { --tw-ring-color: var(--blth-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      textarea { resize: none; }
    </style>
</head>
<body>
<main class="flex h-screen overflow-hidden" data-viewport-mode="app-shell" style="background-color: hsl(var(--blth-background)); color: hsl(var(--blth-foreground)); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;">

  <!-- ============================================ -->
  <!-- 左侧导航栏 -->
  <!-- ============================================ -->
  <aside class="hidden md:flex w-[260px] flex-col flex-shrink-0 border-r" style="background-color: hsl(var(--blth-card)); border-color: hsl(var(--blth-border));">
    <!-- Logo -->
    <div class="px-5 py-4 flex items-center gap-2.5">
      <span class="text-lg font-bold" style="color: hsl(var(--blth-foreground));">B</span>
      <span class="text-sm font-semibold" style="color: hsl(var(--blth-foreground));">Bloath CMS</span>
    </div>

    <!-- 新建文章按钮 -->
    <div class="px-4 pb-3">
      <button class="w-full flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-medium transition-colors duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-1" style="background-color: hsl(var(--blth-primary)); color: hsl(var(--blth-primary-foreground)); border-radius: var(--blth-radius-md); --tw-ring-color: hsl(var(--blth-ring));" onmouseover="this.style.opacity='0.88'" onmouseout="this.style.opacity='1'" onmousedown="this.style.opacity='0.75'">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        <span>新建文章</span>
      </button>
    </div>

    <!-- 仓库选择器 -->
    <div class="px-4 pb-2">
      <button class="w-full h-9 px-3 text-sm flex items-center gap-2 truncate transition-colors duration-150 border" style="color: hsl(var(--blth-foreground)); border-color: hsl(var(--blth-border)); border-radius: var(--blth-radius-md); background-color: hsl(var(--blth-card));" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='hsl(var(--blth-card))'">
        <i data-lucide="folder" class="w-4 h-4 flex-shrink-0" style="color: hsl(var(--blth-muted-foreground));"></i>
        <span class="truncate">username/hugo-blog</span>
        <i data-lucide="chevron-down" class="w-4 h-4 flex-shrink-0" style="color: hsl(var(--blth-muted-foreground));"></i>
      </button>
    </div>

    <!-- 分支选择器 -->
    <div class="px-4 pb-2">
      <button class="w-full h-8 px-3 text-sm flex items-center gap-2 truncate transition-colors duration-150 border" style="color: hsl(var(--blth-foreground)); border-color: hsl(var(--blth-border)); border-radius: var(--blth-radius-md); background-color: hsl(var(--blth-muted));" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='hsl(var(--blth-muted))'">
        <span class="truncate">分支: main</span>
        <i data-lucide="chevron-down" class="w-3.5 h-3.5 flex-shrink-0" style="color: hsl(var(--blth-muted-foreground));"></i>
      </button>
    </div>

    <!-- 分隔线 -->
    <div class="mx-4 border-t" style="border-color: hsl(var(--blth-border));"></div>

    <!-- 导航菜单 -->
    <nav class="px-2 py-2 flex-1">
      <div class="px-3 py-1.5 text-xs font-medium uppercase tracking-wider" style="color: hsl(var(--blth-muted-foreground));">内容</div>
      <a href="#" data-nav-key="dashboard" class="flex items-center gap-2 px-3 py-2 text-sm transition-colors duration-150" style="color: hsl(var(--blth-foreground)); border-radius: var(--blth-radius-md);" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='transparent'">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
        仪表盘
      </a>
      <a href="#" data-nav-key="content" class="flex items-center gap-2 px-3 py-2 text-sm font-medium transition-colors duration-150" style="color: hsl(var(--blth-foreground)); background-color: hsl(var(--blth-muted)); border-radius: var(--blth-radius-md);">
        <i data-lucide="home" class="w-4 h-4"></i>
        内容库
      </a>
      <a href="#" data-nav-key="drafts" class="flex items-center gap-2 px-3 py-2 text-sm transition-colors duration-150" style="color: hsl(var(--blth-foreground)); border-radius: var(--blth-radius-md);" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='transparent'">
        <i data-lucide="file-plus-2" class="w-4 h-4"></i>
        草稿箱
      </a>
      <a href="#" data-nav-key="media" class="flex items-center gap-2 px-3 py-2 text-sm transition-colors duration-150" style="color: hsl(var(--blth-foreground)); border-radius: var(--blth-radius-md);" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='transparent'">
        <i data-lucide="image" class="w-4 h-4"></i>
        媒体库
      </a>
      <a href="#" data-nav-key="settings" class="flex items-center gap-2 px-3 py-2 text-sm transition-colors duration-150" style="color: hsl(var(--blth-foreground)); border-radius: var(--blth-radius-md);" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='transparent'">
        <i data-lucide="settings" class="w-4 h-4"></i>
        设置
      </a>
    </nav>

    <!-- 底部用户信息 -->
    <div class="border-t px-4 py-3" style="border-color: hsl(var(--blth-border));">
      <div class="flex items-center gap-2 p-2 transition-colors duration-150" style="border-radius: var(--blth-radius-md);" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='transparent'">
        <div class="w-7 h-7 rounded-full overflow-hidden flex-shrink-0" style="background-color: hsl(var(--blth-primary));">
          <div class="w-full h-full flex items-center justify-center text-xs font-medium" style="color: hsl(var(--blth-primary-foreground));">U</div>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium truncate" style="color: hsl(var(--blth-foreground));">username</p>
        </div>
        <i data-lucide="chevron-down" class="w-3.5 h-3.5 flex-shrink-0" style="color: hsl(var(--blth-muted-foreground));"></i>
      </div>
    </div>
  </aside>

  <!-- ============================================ -->
  <!-- 右侧主内容区 -->
  <!-- ============================================ -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- 顶部栏 -->
    <header class="h-12 flex items-center justify-between px-6 flex-shrink-0 border-b" style="background-color: hsl(var(--blth-card)); border-color: hsl(var(--blth-border));">
      <!-- 左侧：返回按钮 + 标题 -->
      <div class="flex items-center gap-3">
        <button class="flex items-center justify-center w-8 h-8 transition-colors duration-150" style="color: hsl(var(--blth-muted-foreground)); border-radius: var(--blth-radius-md);" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'; this.style.color='hsl(var(--blth-foreground))'" onmouseout="this.style.backgroundColor='transparent'; this.style.color='hsl(var(--blth-muted-foreground))'" title="返回">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </button>
        <h1 class="text-sm font-semibold" style="color: hsl(var(--blth-foreground));">新建文章</h1>
      </div>
      <!-- 右侧：保存草稿 + 发布 -->
      <div class="flex items-center gap-2">
        <button class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium transition-colors duration-150 border" style="color: hsl(var(--blth-foreground)); border-color: hsl(var(--blth-border)); background-color: hsl(var(--blth-card)); border-radius: var(--blth-radius-md);" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='hsl(var(--blth-card))'">
          <i data-lucide="save" class="w-3.5 h-3.5"></i>
          保存草稿
        </button>
        <button class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium transition-colors duration-150" style="background-color: hsl(var(--blth-primary)); color: hsl(var(--blth-primary-foreground)); border-radius: var(--blth-radius-md);" onmouseover="this.style.opacity='0.88'" onmouseout="this.style.opacity='1'">
          <i data-lucide="upload" class="w-3.5 h-3.5"></i>
          发布
        </button>
      </div>
    </header>

    <!-- 页面内容（居中表单） -->
    <div class="flex-1 overflow-y-auto" data-scroll-region="primary">
      <div class="max-w-[800px] mx-auto px-6 py-8">

        <!-- 表单卡片 -->
        <div class="border p-6 space-y-5" style="background-color: hsl(var(--blth-card)); border-color: hsl(var(--blth-border)); border-radius: var(--blth-radius-lg);">

          <!-- 集合选择 -->
          <div class="space-y-1.5">
            <label class="text-xs font-medium" style="color: hsl(var(--blth-muted-foreground));">内容集合</label>
            <div class="relative">
              <select class="w-full h-9 px-3 pr-9 text-sm appearance-none transition-colors duration-150 border focus:outline-none" style="background-color: hsl(var(--blth-card)); color: hsl(var(--blth-foreground)); border-color: hsl(var(--blth-border)); border-radius: var(--blth-radius-md);" onfocus="this.style.borderColor='hsl(var(--blth-primary))'; this.style.boxShadow='0 0 0 1px hsla(var(--blth-primary), 0.3)'" onblur="this.style.borderColor='hsl(var(--blth-border))'; this.style.boxShadow='none'">
                <option value="posts">posts</option>
                <option value="pages">pages</option>
              </select>
              <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none" style="color: hsl(var(--blth-muted-foreground));"></i>
            </div>
          </div>

          <!-- 标题输入 -->
          <div>
            <input type="text" placeholder="输入文章标题..." class="w-full text-2xl font-semibold bg-transparent focus:outline-none" style="color: hsl(var(--blth-foreground));">
          </div>

          <!-- Slug 输入 -->
          <div class="space-y-1.5">
            <label class="text-xs font-medium" style="color: hsl(var(--blth-muted-foreground));">URL 路径</label>
            <div class="flex items-stretch overflow-hidden border" style="border-color: hsl(var(--blth-border)); border-radius: var(--blth-radius-md);">
              <span class="flex items-center px-3 text-sm" style="color: hsl(var(--blth-muted-foreground)); background-color: hsl(var(--blth-muted));">/posts/</span>
              <input type="text" placeholder="url-slug" class="flex-1 px-3 py-2 text-sm bg-transparent focus:outline-none" style="color: hsl(var(--blth-foreground));">
            </div>
          </div>

          <!-- 分隔线 -->
          <div class="border-t" style="border-color: hsl(var(--blth-border));"></div>

          <!-- 内容编辑区 -->
          <div class="space-y-2">
            <label class="text-xs font-medium" style="color: hsl(var(--blth-muted-foreground));">正文内容</label>
            <!-- 工具栏 -->
            <div class="flex items-center gap-1 p-1 border" style="border-color: hsl(var(--blth-border)); border-radius: var(--blth-radius-md);">
              <button class="flex items-center justify-center w-7 h-7 transition-colors duration-150" style="color: hsl(var(--blth-foreground)); border-radius: var(--blth-radius-sm);" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='transparent'" title="加粗">
                <i data-lucide="bold" class="w-4 h-4"></i>
              </button>
              <button class="flex items-center justify-center w-7 h-7 transition-colors duration-150" style="color: hsl(var(--blth-foreground)); border-radius: var(--blth-radius-sm);" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='transparent'" title="斜体">
                <i data-lucide="italic" class="w-4 h-4"></i>
              </button>
              <button class="flex items-center justify-center w-7 h-7 transition-colors duration-150" style="color: hsl(var(--blth-foreground)); border-radius: var(--blth-radius-sm);" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='transparent'" title="标题">
                <i data-lucide="heading" class="w-4 h-4"></i>
              </button>
              <div class="w-px h-5 mx-0.5" style="background-color: hsl(var(--blth-border));"></div>
              <button class="flex items-center justify-center w-7 h-7 transition-colors duration-150" style="color: hsl(var(--blth-foreground)); border-radius: var(--blth-radius-sm);" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='transparent'" title="列表">
                <i data-lucide="list" class="w-4 h-4"></i>
              </button>
              <button class="flex items-center justify-center w-7 h-7 transition-colors duration-150" style="color: hsl(var(--blth-foreground)); border-radius: var(--blth-radius-sm);" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='transparent'" title="代码">
                <i data-lucide="code" class="w-4 h-4"></i>
              </button>
              <button class="flex items-center justify-center w-7 h-7 transition-colors duration-150" style="color: hsl(var(--blth-foreground)); border-radius: var(--blth-radius-sm);" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='transparent'" title="链接">
                <i data-lucide="link" class="w-4 h-4"></i>
              </button>
            </div>
            <!-- textarea -->
            <textarea placeholder="开始写作..." class="w-full px-3 py-3 text-sm leading-relaxed border transition-colors duration-150 focus:outline-none" style="min-height: 300px; background-color: hsl(var(--blth-card)); color: hsl(var(--blth-foreground)); border-color: hsl(var(--blth-border)); border-radius: var(--blth-radius-md);" onfocus="this.style.borderColor='hsl(var(--blth-primary))'; this.style.boxShadow='0 0 0 1px hsla(var(--blth-primary), 0.3)'" onblur="this.style.borderColor='hsl(var(--blth-border))'; this.style.boxShadow='none'"></textarea>
          </div>

          <!-- 分隔线 -->
          <div class="border-t" style="border-color: hsl(var(--blth-border));"></div>

          <!-- Front Matter 区域 -->
          <div class="space-y-4">
            <div class="flex items-center gap-1.5">
              <i data-lucide="file-text" class="w-3.5 h-3.5" style="color: hsl(var(--blth-muted-foreground));"></i>
              <h3 class="text-xs font-semibold uppercase tracking-wider" style="color: hsl(var(--blth-muted-foreground));">Front Matter</h3>
            </div>

            <!-- 两列网格：日期 + 分类 -->
            <div class="grid grid-cols-2 gap-4">
              <div class="space-y-1.5">
                <label class="text-xs font-medium" style="color: hsl(var(--blth-muted-foreground));">日期</label>
                <input type="date" class="w-full h-9 px-3 text-sm transition-colors duration-150 border focus:outline-none" style="background-color: hsl(var(--blth-card)); color: hsl(var(--blth-foreground)); border-color: hsl(var(--blth-border)); border-radius: var(--blth-radius-md);" onfocus="this.style.borderColor='hsl(var(--blth-primary))'; this.style.boxShadow='0 0 0 1px hsla(var(--blth-primary), 0.3)'" onblur="this.style.borderColor='hsl(var(--blth-border))'; this.style.boxShadow='none'">
              </div>
              <div class="space-y-1.5">
                <label class="text-xs font-medium" style="color: hsl(var(--blth-muted-foreground));">分类</label>
                <div class="relative">
                  <select class="w-full h-9 px-3 pr-9 text-sm appearance-none transition-colors duration-150 border focus:outline-none" style="background-color: hsl(var(--blth-card)); color: hsl(var(--blth-foreground)); border-color: hsl(var(--blth-border)); border-radius: var(--blth-radius-md);" onfocus="this.style.borderColor='hsl(var(--blth-primary))'; this.style.boxShadow='0 0 0 1px hsla(var(--blth-primary), 0.3)'" onblur="this.style.borderColor='hsl(var(--blth-border))'; this.style.boxShadow='none'">
                    <option value="">选择分类</option>
                    <option value="tech">技术</option>
                    <option value="life">生活</option>
                    <option value="notes">笔记</option>
                  </select>
                  <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none" style="color: hsl(var(--blth-muted-foreground));"></i>
                </div>
              </div>
            </div>

            <!-- 标签 -->
            <div class="space-y-1.5">
              <label class="text-xs font-medium" style="color: hsl(var(--blth-muted-foreground));">标签</label>
              <div class="flex flex-wrap items-center gap-2 px-3 py-2 transition-colors duration-150 border" style="background-color: hsl(var(--blth-card)); border-color: hsl(var(--blth-border)); border-radius: var(--blth-radius-md);" onfocusin="this.style.borderColor='hsl(var(--blth-primary))'; this.style.boxShadow='0 0 0 1px hsla(var(--blth-primary), 0.3)'" onfocusout="this.style.borderColor='hsl(var(--blth-border))'; this.style.boxShadow='none'">
                <!-- 已添加标签 -->
                <span class="inline-flex items-center gap-1 px-2 py-0.5 text-xs" style="background-color: hsl(var(--blth-muted)); color: hsl(var(--blth-foreground)); border-radius: var(--blth-radius-sm);">
                  Hugo
                  <button class="transition-opacity duration-150" style="color: hsl(var(--blth-muted-foreground));" onmouseover="this.style.opacity='0.6'" onmouseout="this.style.opacity='1'">
                    <i data-lucide="x" class="w-3 h-3"></i>
                  </button>
                </span>
                <span class="inline-flex items-center gap-1 px-2 py-0.5 text-xs" style="background-color: hsl(var(--blth-muted)); color: hsl(var(--blth-foreground)); border-radius: var(--blth-radius-sm);">
                  CMS
                  <button class="transition-opacity duration-150" style="color: hsl(var(--blth-muted-foreground));" onmouseover="this.style.opacity='0.6'" onmouseout="this.style.opacity='1'">
                    <i data-lucide="x" class="w-3 h-3"></i>
                  </button>
                </span>
                <input type="text" placeholder="添加标签..." class="flex-1 min-w-[100px] text-sm bg-transparent focus:outline-none" style="color: hsl(var(--blth-foreground));">
              </div>
            </div>

            <!-- 描述 -->
            <div class="space-y-1.5">
              <label class="text-xs font-medium" style="color: hsl(var(--blth-muted-foreground));">描述</label>
              <textarea placeholder="文章描述..." class="w-full px-3 py-2 text-sm leading-relaxed border transition-colors duration-150 focus:outline-none" style="min-height: 72px; background-color: hsl(var(--blth-card)); color: hsl(var(--blth-foreground)); border-color: hsl(var(--blth-border)); border-radius: var(--blth-radius-md);" onfocus="this.style.borderColor='hsl(var(--blth-primary))'; this.style.boxShadow='0 0 0 1px hsla(var(--blth-primary), 0.3)'" onblur="this.style.borderColor='hsl(var(--blth-border))'; this.style.boxShadow='none'"></textarea>
            </div>

            <!-- 草稿开关 -->
            <div class="flex items-center justify-between py-1">
              <span class="text-sm" style="color: hsl(var(--blth-foreground));">保存为草稿</span>
              <button class="relative inline-flex h-5 w-9 items-center transition-colors duration-200" style="background-color: hsl(var(--blth-muted)); border-radius: 9999px;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'" onclick="var k=this.querySelector('span'); var on=this.getAttribute('data-on')==='true'; this.setAttribute('data-on', String(!on)); if(!on){this.style.backgroundColor='hsl(var(--blth-primary))'; k.style.transform='translateX(16px)'; k.style.backgroundColor='hsl(var(--blth-primary-foreground))';} else {this.style.backgroundColor='hsl(var(--blth-muted))'; k.style.transform='translateX(0)'; k.style.backgroundColor='hsl(var(--blth-card))';}" data-on="false">
                <span class="inline-block h-4 w-4 transform transition-transform duration-200" style="background-color: hsl(var(--blth-card)); border-radius: 9999px; transform: translateX(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.15);"></span>
              </button>
            </div>
          </div>

        </div>

        <!-- 底部操作栏 -->
        <div class="flex items-center justify-between mt-6">
          <button class="flex items-center gap-1.5 px-4 py-2 text-sm font-medium transition-colors duration-150 border" style="color: hsl(var(--blth-foreground)); border-color: hsl(var(--blth-border)); background-color: hsl(var(--blth-card)); border-radius: var(--blth-radius-md);" onmouseover="this.style.backgroundColor='hsl(var(--blth-muted))'" onmouseout="this.style.backgroundColor='hsl(var(--blth-card))'">
            <i data-lucide="x" class="w-4 h-4"></i>
            取消
          </button>
          <button class="flex items-center gap-1.5 px-4 py-2 text-sm font-medium transition-colors duration-150" style="background-color: hsl(var(--blth-primary)); color: hsl(var(--blth-primary-foreground)); border-radius: var(--blth-radius-md);" onmouseover="this.style.opacity='0.88'" onmouseout="this.style.opacity='1'">
            <i data-lucide="check" class="w-4 h-4"></i>
            保存并发布
          </button>
        </div>

      </div>
    </div>
  </div>
</main>
  <script>lucide.createIcons();</script>
</body>
</html>
